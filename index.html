<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet">
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">
    <title>Product preview card component</title>
  </head>
  <body>
    <div class="component">
      <picture>
        <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg">
        <img
          class="product-image"
          src="./images/image-product-mobile.jpg"
          alt="Gabrielle Essence Eau De Parfum bottle">
      </picture>
      <div class="card-content">
        <p class="brandName">PERFUME</p>
        <h1 class="infor">Gabrielle Essence Eau De Parfum</h1>
        <p class="description">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="price">
          <p class="onSalePrice">$149.99</p>
          <p class="originalPrice">$169.99</p>
        </div>
        <button type="button" class="cart-button">
          <img src="./images/icon-cart.svg" alt="" aria-hidden="true">
          Add to Cart
        </button>
      </div>
    </div>
  </body>
</html>
